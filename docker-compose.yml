services:
  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: challenge
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready
      interval: 5s
      timeout: 5s
      retries: 5

  grafana-lgtm:
    image: grafana/otel-lgtm:0.28.0
    restart: unless-stopped
    container_name: grafana-lgtm
    ports:
      - "4317:4317"
      - "4318:4318"
      - "3000:3000"
